<!DOCTYPE html><!--descreve a linguagem de programação que esta sendo ultilização, nesse caso é o HTHL-->
<html lang="pt-bt"><!--inicio do documento-->
<head>><!--define o cabeçalho do documento. O descrito aqui não aparece no navegador. Essa tag serve para inserir fplhas de estilo script-->
    <meta charset="UTF-8"<!--indica quais serão os caraquiteres (characerset ou charset) sera utilizado para renderizar o texto da pagina-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--fornece os metodos do site para navegador-->
    <title>Document</title>
</head><!--fechamento do cabeçalho do documento-->
<body><!-- é o espaço em todas as tags devem ser colocadas. O conteudos aqui contigo é visiual da pagína. As tags que representam textos, e outros devem ser adicionadas nesse intervalo.-->
       <!--Um documento é composto por tags precisam ser abertas  e fechadas, o que diferenciam é que as tags de fechamento possuem uma \ antes do nome-->
</body>
</html><!--fim do documento
